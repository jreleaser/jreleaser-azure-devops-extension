parameters:
- name: marketplacePublisher
  type: string
- name: marketplaceExtensionName
  type: string
- name: marketplaceExtensionId
  type: string
- name: extensionVisibility
  type: string
- name: shareWith
  type: string
  default: ''
- name: unpublishFirst
  type: boolean
  default: false

stages:
- stage: Publish_JReleaser_Extension
  dependsOn:
  - Build
  jobs:
  - job: Publish_JReleaser_Extension
    steps:
    - checkout: self
      fetchTags: true
      clean: true
    - task: CmdLine@2
      displayName: 'set release version'
      inputs:
        script: |
          source_branch="$(Build.SourceBranch)"
          if [[ "$source_branch" != refs/tags/* ]]; then
            echo "Build was not triggered by a tag, exiting."
            exit 1
          fi
          version="${source_branch#refs/tags/}"
          echo "##vso[task.setvariable variable=extensionVersion]$version"
    - task: DownloadPipelineArtifact@2
      displayName: 'download JReleaserExtension'
      inputs:
        artifact: JReleaserExtension
        path: $(System.DefaultWorkingDirectory)
    - task: CmdLine@2
      displayName: 'update extension and task versions'
      inputs:
        script: |
          node <<'NODE'
          const fs = require('fs');

          const extensionVersion = process.env.EXTENSION_VERSION;
          if (!extensionVersion) {
            throw new Error('EXTENSION_VERSION is not set');
          }

          const normalizedExtensionVersion = extensionVersion.replace(/^v/, '');
          const taskVersionMatch = normalizedExtensionVersion.match(/^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/);
          if (!taskVersionMatch) {
            throw new Error(`Invalid extension version: ${extensionVersion}`);
          }

          const taskVersion = {
            Major: taskVersionMatch[1],
            Minor: taskVersionMatch[2],
            Patch: taskVersionMatch[3],
          };

          function updateJson(file, updater) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            updater(json);
            fs.writeFileSync(file, `${JSON.stringify(json, null, 2)}\n`);
          }

          updateJson('jreleaser-azure-devops-extension.json', manifest => {
            manifest.version = normalizedExtensionVersion;
          });

          for (const taskJson of [
            'tasks/JReleaserInstaller/task.json',
            'tasks/JReleaserTask/task.json',
          ]) {
            updateJson(taskJson, task => {
              task.version = { ...task.version, ...taskVersion };
            });
          }

          console.log(`Updated extension manifest to ${normalizedExtensionVersion}`);
          console.log(`Updated task versions to ${taskVersion.Major}.${taskVersion.Minor}.${taskVersion.Patch}`);
          NODE
      env:
        EXTENSION_VERSION: $(extensionVersion)
    - task: TfxInstaller@5
      displayName: 'install tfx-cli'
      inputs:
        version: '0.14.x'
        checkLatest: true
    - ${{ if eq(parameters.unpublishFirst, true) }}:
      - task: UnpublishAzureDevOpsExtension@5
        inputs:
          connectTo: 'VsTeam'
          connectedServiceName: 'jreleaser_publish'
          method: 'id'
          publisherId: '${{ parameters.marketplacePublisher }}'
          extensionId: '${{ parameters.marketplaceExtensionId }}'
    - task: PackageAzureDevOpsExtension@5
      inputs:
        rootFolder: '$(System.DefaultWorkingDirectory)'
        patternManifest: 'jreleaser-azure-devops-extension.json'
        outputPath: 'jreleaser-azure-devops-extension.vsix'
        updateTasksVersion: false
        extensionName: '${{ parameters.marketplaceExtensionName }}'
        extensionId: '${{ parameters.marketplaceExtensionId }}'
        extensionVersion: '$(extensionVersion)'
        extensionVisibility: '${{ parameters.extensionVisibility }}'
        extensionPricing: 'free'
    - task: PublishAzureDevOpsExtension@5
      name: publish
      inputs:
        connectTo: 'VsTeam'
        connectedServiceName: 'jreleaser_publish'
        fileType: 'vsix'
        vsixFile: 'jreleaser-azure-devops-extension.vsix'
        updateTasksVersion: false
        ${{ if ne(parameters.shareWith, '') }}:
          shareWith: '${{ parameters.shareWith }}'
    - publish: 'jreleaser-azure-devops-extension.vsix'
      artifact: JReleaserExtension-vsix
    - task: CmdLine@2
      displayName: 'wait for 1 minute'
      inputs:
        script: 'sleep 60'
