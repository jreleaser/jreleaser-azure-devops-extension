stages:
- stage: Publish_JReleaser_Extension
  dependsOn: Test
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
  jobs:
  - job: Publish_JReleaser_Extension
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: 'download the tested VSIX'
      inputs:
        artifact: JReleaserExtension-vsix
        path: $(Pipeline.Workspace)/JReleaserExtension-vsix
    - task: TfxInstaller@5
      inputs:
        version: '0.14.0'
    - task: PublishAzureDevOpsExtension@5
      name: publish
      inputs:
        connectTo: 'VsTeam'
        connectedServiceName: 'jreleaser_publish'
        fileType: 'vsix'
        vsixFile: '$(Pipeline.Workspace)/JReleaserExtension-vsix/jreleaser-azure-devops-extension.vsix'
        updateTasksVersion: false
